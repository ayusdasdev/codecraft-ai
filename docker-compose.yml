services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      CONFIG_S3_BUCKET: codecraft-ai-storage
      CONFIG_S3_KEY: config/.aws_credentials
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    restart: unless-stopped